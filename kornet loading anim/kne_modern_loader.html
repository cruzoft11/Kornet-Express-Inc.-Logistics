<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Loading Animation</title>
<style>
  :root {
    --blue: #07558f;
    --red: #d71920;
    --taupe: #806b6b;
    --track: rgba(7, 85, 143, 0.10);
    --bg: #f7f9fc;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: var(--bg);
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .loader {
    width: 150px;
    height: 150px;
    position: relative;
  }

  /* Main buffering ring */
  .ring {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 5px solid var(--track);
    border-top-color: var(--blue);
    border-right-color: var(--red);
    border-bottom-color: var(--taupe);
    animation: spin 1.15s cubic-bezier(.55,.08,.35,.92) infinite;
  }

  /* Smaller inner ring gives it a more polished app-loader feel */
  .inner-ring {
    position: absolute;
    inset: 38px;
    border-radius: 50%;
    border: 3px solid rgba(128, 107, 107, .12);
    border-left-color: var(--blue);
    border-bottom-color: var(--red);
    animation: reverseSpin .8s linear infinite;
  }

  /* Three tiny particles use the logo palette without recreating the logo */
  .particle {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    top: 71px;
    left: 71px;
    transform-origin: 4px 4px;
  }

  .particle:nth-child(3) { background: var(--blue); animation: orbit 1.8s linear infinite; }
  .particle:nth-child(4) { background: var(--red); animation: orbit 1.8s linear -.6s infinite; }
  .particle:nth-child(5) { background: var(--taupe); animation: orbit 1.8s linear -1.2s infinite; }

  .center {
    position: absolute;
    inset: 58px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 4px 18px rgba(23, 32, 42, .08);
    animation: pulse 1.15s ease-in-out infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes reverseSpin {
    to { transform: rotate(-360deg); }
  }

  @keyframes orbit {
    from {
      transform: rotate(0deg) translateX(31px);
    }
    to {
      transform: rotate(360deg) translateX(31px);
    }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(.92); opacity: .92; }
    50% { transform: scale(1); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring, .inner-ring, .particle, .center {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="loader" aria-label="Loading" role="status">
    <div class="ring"></div>
    <div class="inner-ring"></div>

    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="center"></div>
  </div>
</body>
</html>
