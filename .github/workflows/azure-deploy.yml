name: Build and Deploy Kornet Express Logistics to Azure Web App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Root & Frontend Dependencies
        working-directory: kornet-system
        run: npm ci

      - name: Build Frontend (Vite)
        working-directory: kornet-system
        run: npm run build

      - name: Install Backend Dependencies & Generate Prisma
        working-directory: kornet-system/server
        # DATABASE_URL must be set for prisma generate/validate to work in CI.
        # Use a dummy SQLite path — the real path is set in Azure App Settings.
        env:
          DATABASE_URL: file:./prisma/data/kornet.db
          ACCOUNTING_DB_PATH: ./prisma/data/accounting.db
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Prepare Deployment Bundle
        run: |
          mkdir -p deploy-bundle
          cp -r kornet-system/dist deploy-bundle/dist
          cp -r kornet-system/server deploy-bundle/server
          # Never ship .db files — production DB lives on persistent Azure storage
          find deploy-bundle -name "*.db" -delete
          find deploy-bundle -name "*.db-journal" -delete
          cp kornet-system/package.json deploy-bundle/package.json
          cp kornet-system/package-lock.json deploy-bundle/package-lock.json

      - name: Install Production Node Modules for Bundle
        working-directory: deploy-bundle
        env:
          DATABASE_URL: file:./server/prisma/data/kornet.db
        run: |
          npm ci --omit=dev
          cd server && npm ci --omit=dev && npx prisma generate

      - name: Add startup script
        run: |
          cat > deploy-bundle/startup.sh << 'EOF'
          #!/bin/bash
          set -e
          cd /home/site/wwwroot
          # The server performs a backed-up, non-destructive schema sync before listening.
          node server/dist/src/index.js
          EOF
          chmod +x deploy-bundle/startup.sh

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'kornet-logistics-prod' }}
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy-bundle
